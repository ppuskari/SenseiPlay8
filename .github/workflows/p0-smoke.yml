name: SenseiPlay8 P0 validation

on:
  push:
  pull_request:

jobs:
  p0-software-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore original P0 demo and binary on each OS
        run: python tools/import-p0.py recovery/senseiplay_iie_p0_sources.patch
      - name: Run P0 synthetic demo and converter
        run: |
          python tools/make_demo_mod.py
          python tools/mod_to_s8m.py assets/sensei8-original-demo.mod
          python tools/s8asm.py src/sensei8.s --out build/SENSEI8.BIN
      - name: Diagnose cross-platform artifact hashes
        run: python -c "from pathlib import Path; from hashlib import sha256; files=['assets/sensei8-original-demo.mod','dist/SENSEI8-P0.BIN','build/SENSEI8.BIN']; [print(p,sha256(Path(p).read_bytes()).hexdigest()) for p in files]"
      - name: Verify generated synthetic MOD is bit-identical to archive
        run: python -c "from pathlib import Path; import json,hashlib; m=json.loads(Path('recovery/original-P0-MANIFEST.json').read_text()); actual=hashlib.sha256(Path('assets/sensei8-original-demo.mod').read_bytes()).hexdigest(); assert actual==m['assets/sensei8-original-demo.mod']['sha256'], 'demo MOD mismatch'"
      - name: Run 6502 and DOC bus simulator
        run: python tests/test_player.py
      - name: Verify bit-identical P0 rebuild
        run: python -c "from pathlib import Path; assert Path('dist/SENSEI8-P0.BIN').read_bytes() == Path('build/SENSEI8.BIN').read_bytes(), 'P0 binary mismatch'"
      - name: Package recovered P0 hardware test assets
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: SenseiPlay8-P0-test-assets
          path: |
            dist/SENSEI8-P0.BIN
            assets/sensei8-original-demo.mod
          if-no-files-found: error
